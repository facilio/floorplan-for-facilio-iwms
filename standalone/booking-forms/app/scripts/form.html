<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facilio Booking Form</title>
    <style>
      body { margin: 0; padding: 20px; background: #f5f7fa; }
      #root { max-width: 600px; margin: 0 auto; background: #fff; border: 1px solid #d5dce4; border-radius: 12px; padding: 20px; font: 400 13.5px system-ui, -apple-system, sans-serif; color: #1c2733; }
      .fbf-fail { color: #8f2323; }
    </style>
  </head>
  <body>
    <div id="root">Loading…</div>

    <!-- React ships INSIDE this app (app/scripts/vendor/*.js — .js is an allowed upload type), so
         the form renders even when the host's CSP blocks third-party CDNs. The unpkg copies stay
         as a fallback for a deploy where the vendor folder wasn't uploaded. -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script>
      // Only reach for the CDN if the local copies didn't land.
      (function () {
        function cdn(src) {
          document.write('<script crossorigin src="' + src + '"><\/script>');
        }
        if (!window.React) cdn('https://unpkg.com/react@18/umd/react.production.min.js');
        if (!window.ReactDOM) cdn('https://unpkg.com/react-dom@18/umd/react-dom.production.min.js');
      })();
    </script>
    <script src="./bookingForms.js"></script>
    <script>
      // Resource comes from the embed URL, e.g. ?unitType=room&resourceId=123&resourceLabel=E-1-CO11
      // (the connected-app host also appends origin & capp_id — FacilioAppSDK.init() needs both).
      var q = new URLSearchParams(window.location.search);
      var unitType = q.get('unitType') || 'workstation';
      var resourceId = Number(q.get('resourceId'));
      var resourceLabel = q.get('resourceLabel') || ('#' + resourceId);
      var rootEl = document.getElementById('root');
      if (!window.React || !window.ReactDOM) {
        // Say WHICH dependency is missing instead of sitting on "Loading…" forever.
        rootEl.className = 'fbf-fail';
        rootEl.textContent =
          'React did not load — upload app/scripts/vendor/react.production.min.js and react-dom.production.min.js with this app (the CDN fallback is blocked by this host).';
      } else if (!window.FacilioBookingForms) {
        rootEl.className = 'fbf-fail';
        rootEl.textContent = 'bookingForms.js did not load — check that app/scripts/bookingForms.js was uploaded next to this page.';
      } else if (!resourceId) {
        rootEl.textContent = 'Missing ?resourceId= in the URL (also supported: unitType, resourceLabel).';
      } else {
        FacilioBookingForms.mount(rootEl, {
          unitType: unitType,
          resourceId: resourceId,
          resourceLabel: resourceLabel,
          onDone: function (id) {
            rootEl.innerHTML = '<p style="font: 600 14px system-ui">Booked ✓ (spacebooking #' + id + ')</p>';
          },
        });
      }
    </script>
  </body>
</html>
